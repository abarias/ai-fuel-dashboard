[package]
name = "ai-fuel-dashboard"
version = "0.1.0"
description = "AI Fuel Dashboard — track AI coding capacity"
authors = []
edition = "2021"

[lib]
name = "ai_fuel_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-sql  = { version = "2", features = ["sqlite"] }
tauri-plugin-process = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
